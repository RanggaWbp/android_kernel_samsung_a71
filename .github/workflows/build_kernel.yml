name: Build and Release ReSukiSU Kernel

on:
  workflow_dispatch:
    inputs:
      device_target:
        description: Pilih target device untuk dibuild
        required: true
        default: all
        type: choice
        options:
          - all
          - a71
          - m51
  push:
    branches:
      - lineage-23.2
    paths-ignore:
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: a71
            device_model: Galaxy-A71
            defconfig: a71_defconfig
          - device: m51
            device_model: Galaxy-M51
            defconfig: m51_defconfig

    steps:
      - name: Filter Target Device
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.device_target != 'all' && github.event.inputs.device_target != matrix.device
        run: |
          echo "Skipping build for ${{ matrix.device }}"
          exit 0

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libxml2 libxml2-utils lz4 zlib1g-dev libncurses5 libssl-dev \
            python3 python2 libtinfo5 zip unzip binutils-aarch64-linux-gnu tzdata

      - name: Setup Proton-Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/proton-clang"

      - name: Generate Build Metadata
        id: meta
        run: |
          export TZ='Asia/Jakarta'
          TGL_INDO=$(date +'%d-%m-%Y')
          JAM_INDO=$(date +'%H.%M')
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEVICE_UPPER=$(echo "${{ matrix.device }}" | tr '[:lower:]' '[:upper:]')
          
          ZIP_NAME="ReSukiSU-Kernel-${DEVICE_UPPER}-${TGL_INDO}-${JAM_INDO}-WIB-${SHORT_SHA}.zip"
          TAG_NAME="v4.2.0-${DEVICE_UPPER}-${TGL_INDO}-${SHORT_SHA}"
          
          echo "tgl_indo=${TGL_INDO}" >> $GITHUB_OUTPUT
          echo "jam_indo=${JAM_INDO}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Compile Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          mkdir -p out
          
          make O=out ARCH=arm64 \
               HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLD=/usr/bin/ld \
               ${{ matrix.defconfig }}
          
          make O=out ARCH=arm64 \
               CC=clang \
               HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLD=/usr/bin/ld \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               -j$(nproc --all)

      - name: Package with AnyKernel3 (Boot Header v2 Format)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ak3_build"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/ak3_build"
          
          cp "$GITHUB_WORKSPACE/build_tools/anykernel.sh" "$GITHUB_WORKSPACE/ak3_build/anykernel.sh"
          
          # Salin Image murni dan dtb terpisah sesuai Boot Header v2
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/ak3_build/Image"
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/qcom/sdmmagpie.dtb" "$GITHUB_WORKSPACE/ak3_build/dtb"
          
          cd "$GITHUB_WORKSPACE/ak3_build"
          zip -r9 "$GITHUB_WORKSPACE/${{ steps.meta.outputs.zip_name }}" * -x .git README.md *placeholder
          cd "$GITHUB_WORKSPACE"
          ls -lh "${{ steps.meta.outputs.zip_name }}"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_name }}
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ReSukiSU Kernel ${{ matrix.device_model }} [${{ steps.meta.outputs.tgl_indo }}]
          body: |
            ### Custom Kernel ReSukiSU Build (Boot Header v2)
            * **Device Target:** ${{ matrix.device_model }} (`${{ matrix.device }}`)
            * **Platform:** Qualcomm Snapdragon 730G (SM7150)
            * **Kernel Image:** Uncompressed `Image` + Dedicated `dtb`
            * **Compatibility:** Dynamic eBPF Legacy Patch & Dual-Mode (OneUI / AOSP)
            * **Root Support:** ReSukiSU v4.2.0 (Manual Hooks)
            * **Tanggal Rilis:** ${{ steps.meta.outputs.tgl_indo }} (${{ steps.meta.outputs.jam_indo }} WIB)
            * **Commit:** `${{ steps.meta.outputs.short_sha }}`
          files: ${{ steps.meta.outputs.zip_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
